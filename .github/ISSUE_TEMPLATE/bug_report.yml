name: Bug report
description: Report reproducible incorrect behavior in Shun
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities publicly. Follow the [Security Policy](https://github.com/ccchaigordon/shun/blob/main/SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the defect and why it matters.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Shun version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, or another environment
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: shun search "query" --no-color
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a minimal repository fixture or exact reproduction steps.
    validations:
      required: true

  - type: textarea
    id: terminal-output
    attributes:
      label: Terminal output
      description: Remove secrets and unrelated private repository content.
      render: shell

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not describe a security vulnerability.
          required: true
