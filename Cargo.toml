[package]
name = "shun"
version = "0.1.0"
edition = "2024"
description = "A local CLI for repository search and stale-documentation audits"
license = "MIT"
repository = "https://github.com/ccchaigordon/shun"
readme = "README.md"
keywords = ["search", "cli", "repository", "bm25", "documentation"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
term-table = "1.4.0"
textwrap = "0.16.2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
