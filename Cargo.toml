[package]
name = "shun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
term-table = "1.4.0"
textwrap = "0.16.2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
